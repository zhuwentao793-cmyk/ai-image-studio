name: Build & Release Installers

# 触发：
#   - 推送 v* 标签（如 v0.1.0）→ 三平台构建 + 上传安装包 + 创建 GitHub Release（含自动更新清单）
#   - 手动运行（Actions 页面点 Run workflow）→ 只构建并上传 artifacts，不建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: win
            target: nsis
            pattern: 'AI Image Studio Setup *.exe'
          - os: macos-latest
            platform_flag: mac
            target: dmg
            pattern: 'AI Image Studio *.dmg'
          - os: ubuntu-latest
            platform_flag: linux
            target: AppImage
            pattern: 'AI Image Studio *.AppImage'
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder 用它把安装包 + 更新清单(latest*.yml)上传到 GitHub Release
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build renderer/main
        run: npx electron-vite build

      - name: Package ${{ matrix.target }}
        run: npx electron-builder --${{ matrix.platform_flag }} ${{ matrix.target }} ${{ startsWith(github.ref, 'refs/tags/v') && '--publish always' || '' }}

      - name: Upload installer artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform_flag }}
          path: release/${{ matrix.pattern }}
          if-no-files-found: error

  # 仅推 tag 时执行：electron-builder 已上传安装包到草稿 Release，这里写正文并正式发布
  finalize:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog (commits since last tag)
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then LOG=$(git log "$PREV"..HEAD --oneline --no-merges); else LOG=$(git log --oneline --no-merges); fi
          if [ -z "$LOG" ]; then LOG="无（首个发布）"; fi
          printf '%s\n' "$LOG" > /tmp/changelog.txt

      - name: Finalize GitHub Release
        run: |
          cat > /tmp/body.md <<'EOF'
          ## AI Image Studio ${{ github.ref_name }}

          > 由 GitHub Actions 在原生平台自动构建的安装包，见下方 Assets。

          ### 📦 安装包
          - **Windows**：`AI Image Studio Setup *.exe`（NSIS 安装向导，支持应用内自动更新）
          - **macOS**：`*.dmg`
          - **Linux**：`*.AppImage`

          ### 🧾 本次变更
          EOF
          { cat /tmp/body.md; echo; cat /tmp/changelog.txt; } > /tmp/release_body.md
          gh release edit "$GITHUB_REF_NAME" \
            --title "AI Image Studio $GITHUB_REF_NAME" \
            --notes-file /tmp/release_body.md \
            --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
