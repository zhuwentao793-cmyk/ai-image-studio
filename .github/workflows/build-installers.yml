name: Build & Release Installers

# 触发：
#   - 推送 v* 标签（如 v0.1.0）→ 自动构建三种安装包并创建 GitHub Release
#   - 手动运行（Actions 页面点 Run workflow）→ 只构建并上传 artifacts，不建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_flag: win
            target: nsis
            pattern: 'AI Image Studio Setup *.exe'
          - os: macos-latest
            platform_flag: mac
            target: dmg
            pattern: 'AI Image Studio *.dmg'
          - os: ubuntu-latest
            platform_flag: linux
            target: AppImage
            pattern: 'AI Image Studio *.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build renderer/main
        run: npx electron-vite build

      - name: Package ${{ matrix.target }} (native runner)
        run: npx electron-builder --${{ matrix.platform_flag }} ${{ matrix.target }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform_flag }}
          path: release/${{ matrix.pattern }}
          if-no-files-found: error

  # 仅推 tag 时执行：聚合三个安装包并创建 GitHub Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog (commits since last tag)
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then LOG=$(git log "$PREV"..HEAD --oneline --no-merges); else LOG=$(git log --oneline --no-merges); fi
          if [ -z "$LOG" ]; then LOG="无（首个发布）"; fi
          {
            echo "CHANGELOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
          body: |
            ## AI Image Studio ${{ github.ref_name }}

            > 由 GitHub Actions 在原生平台自动构建的安装包，见下方 Assets。

            ### 📦 安装包
            - **Windows**：`AI Image Studio Setup *.exe`（NSIS 安装向导）
            - **macOS**：`*.dmg`
            - **Linux**：`*.AppImage`

            ### 🧾 本次变更
            ${{ steps.changelog.outputs.CHANGELOG }}

            ---
            - 需要真机出图请自备 Stable Diffusion WebUI / ComfyUI 与本机显卡
            - 未内置代码签名，安装时可能提示未知发布者（后续可接入签名）
